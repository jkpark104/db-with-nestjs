# 정규화된 그래프 탐색.
# Order는 userName을 갖지 않고 user 참조만 가진다.
# 클라이언트가 user { name }을 명시할 때만 User Field Resolver가 호출된다.
query OrderDetail($id: Int!) {
  order(id: $id) {
    id
    status
    totalAmount
    createdAt
    user {
      id
      name      # User 한 곳만 진실의 원천 — name → fullName 변경 시 한 번만 수정
      email
    }
    items {
      id
      quantity
      unitPrice
      product {
        id
        name
        price
      }
    }
  }
}
