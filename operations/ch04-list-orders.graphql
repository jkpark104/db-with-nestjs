# 주문 20개 + 각 주문의 user + items + 각 item의 product
# 응답 헤더 x-mock-db-calls를 비교한다.
# Ch03(naive): User=20+, Product=수십 회
# Ch04(DataLoader): User=1, Product=1
query ListOrdersWithItems {
  orders {
    id
    status
    totalAmount
    user { id name }
    items {
      quantity
      unitPrice
      product { id name price }
    }
  }
}
