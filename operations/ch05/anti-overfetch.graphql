# Anti-pattern — 필요 없는 필드까지 모두 가져옴.
# 화면에는 name과 price만 쓰는데도 description, reviews, categories까지 fetch.
query GetProductOverfetch($id: Int!) {
  product(id: $id) {
    id
    name
    price
    stock
    description
    createdAt
    reviews {
      id
      rating
      content
      author { id name email createdAt }
    }
    categories { id name }
  }
}
